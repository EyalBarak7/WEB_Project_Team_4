<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הוספת עבודה</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="LOGO.png">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="main.html">
        <img src="LOGO.png" alt=" צ'קליסט" class="LOGO">
        </a>
            <span class="navbar-brand">צ'קליסט</span>
            <div class="navbar-nav">
                <a class="nav-link" href="main.html">העבודות שלי</a>
                <a class="nav-link active" href="add-task.html">הוספת עבודה</a>
                <a class="nav-link" href="contact.html">צור קשר</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 500px;">
        <h1 class="text-center mb-4">הוספת עבודה חדשה למערכת</h1>
        <div class="bg-white p-4 border rounded shadow-sm">
            <div class="mb-3">
                <label class="form-label">שם המקצוע / הקורס:</label>
                <input type="text" id="subject" class="form-control" placeholder="לדוגמה: פיזיקה 2" required>
            </div>
            <div class="mb-3">
                <label class="form-label">תאריך הגשה מבוקש:</label>
                <input type="date" id="taskDate" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">רמת קושי משוערת:</label>
                <select id="taskDifficulty" class="form-select">
                    <option value="קל">קל</option>
                    <option value="בינוני">בינוני</option>
                    <option value="קשה">קשה</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">פרטי המטלה והנחיות:</label>
                <textarea id="taskDetailsInput" class="form-control" rows="3" placeholder="כתוב כאן מה צריך לעשות במטלה..." required></textarea>
            </div>
            <button type="button" id="btnSaveTask" class="btn btn-success w-100">שמור מטלה במסלול</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
